    function getFreshDraftForm() {
      const children = state && state.will && Array.isArray(state.will.children)
        ? state.will.children.filter(c => c && c.fullName && c.fullName.trim())
        : [];
      const names = children.length > 0 ? children.map(c => c.fullName.trim()) : [];
      let beneficiaries = [];
      if (names.length > 0) {
        const share = Math.floor((100 / names.length) * 100) / 100;
        beneficiaries = names.map((name, i) => ({
          id: 'b-' + Date.now() + '-' + i,
          name,
          percentage: i === names.length - 1 ? Number((100 - share * (names.length - 1)).toFixed(2)) : share
        }));
      } else {
        beneficiaries = [{ id: 'b-1', name: '', percentage: 100 }];
      }

      return {
        nickname: '',
        accountType: 'Taxable Brokerage',
        balance: 0,
        ownershipTitle: 'Sole Name',
        transferMechanism: 'TOD (Transfer on Death)',
        perStirpes: true,
        beneficiaries: beneficiaries,
        error: null
      };
    }

    function loadSavedPlans() {
      try {
        const raw = localStorage.getItem(SAVED_PLANS_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed) && parsed.length > 0) return parsed;
        }
      } catch (e) {
        console.warn('Could not read saved plans from storage:', e);
      }
      return [
        {
          id: 'plan-baseline',
          name: 'Robert J. Vance - Baseline Plan',
          savedAt: new Date().toISOString(),
          state: getDefaultState()
        },
        {
          id: 'plan-scenario-buffer',
          name: 'Vance Family - With $35k Cash Liquidity Buffer',
          savedAt: new Date(Date.now() - 86400000).toISOString(),
          state: (function() {
            const s = getDefaultState();
            s.accounts = s.accounts.map(a => a.id === 'acc-5' ? { ...a, balance: 35000 } : a);
            return s;
          })()
        }
      ];
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.accounts) && parsed.will && parsed.electiveShare) {
            return parsed;
          }
        }
      } catch (e) {
        console.warn('Could not read localStorage:', e);
      }
      return getDefaultState();
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')

    window.saveCurrentPlanSlot = function(e) {
      if (e) e.preventDefault();
      const name = (planNameInput || '').trim();
      if (!name) return;
      const existingIdx = savedPlans.findIndex(p => p.name.toLowerCase() === name.toLowerCase());
      const newSlot = {
        id: existingIdx >= 0 ? savedPlans[existingIdx].id : ('plan-' + Date.now()),
        name: name,
        savedAt: new Date().toISOString(),
        state: JSON.parse(JSON.stringify(state))
      };
      if (existingIdx >= 0) {
        savedPlans[existingIdx] = newSlot;
      } else {
        savedPlans.unshift(newSlot);
      }
      activePlanName = name;
      isPlanModalOpen = false;
      saveState();
      render();
      showToast('Plan "' + name + '" saved successfully.');
    };

    // 1. Select Folder on Computer Hard Drive (Directory Picker with clean fallback)
    window.saveToPickedDirectory = async function() {
      const fileName = (saveAsFileNameInput || 'estate-plan.json').trim();
      const dataStr = getBackupJsonString();

      if ('showDirectoryPicker' in window) {
        try {
          const dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
          const fileHandle = await dirHandle.getFileHandle(fileName, { create: true });
          const writable = await fileHandle.createWritable();
          await writable.write(dataStr);
          await writable.close();
          window.closeSaveAsModal();
          showToast(`Successfully saved "${fileName}" in folder: "${dirHandle.name}"!`);
          return;
        } catch (err) {
          if (err.name === 'AbortError') return; // User closed picker
          console.warn('Directory picker blocked by browser, falling back to download:', err);
        }
      }

      // Graceful fallback: trigger download so user gets file immediately
      window.downloadBackupFile();
      showToast(`Saved "${fileName}" to your computer. (Direct folder access was restricted by your browser).`);
    };

    // 2. Select Location & File via Save-As Dialog (File Picker with clean fallback)
    window.saveWithSaveFilePicker = async function() {
      const fileName = (saveAsFileNameInput || 'estate-plan.json').trim();
      const dataStr = getBackupJsonString();

      if ('showSaveFilePicker' in window) {
        try {
          const handle = await window.showSaveFilePicker({
            suggestedName: fileName,
            types: [
              {
                description: 'JSON Estate Plan Files',
                accept: { 'application/json': ['.json'] }
              }
            ]
          });
          const writable = await handle.createWritable();
          await writable.write(dataStr);
          await writable.close();
          window.closeSaveAsModal();
          showToast(`Saved file to your computer: ${handle.name}`);
          return;
        } catch (err) {
          if (err.name === 'AbortError') return;
          console.warn('Save file picker blocked, falling back to download:', err);
        }
      }

      window.downloadBackupFile();
    };

    // 3. Direct Browser Download
    window.downloadBackupFile = function() {
      const fileName = (saveAsFileNameInput || 'estate-plan.json').trim();
      const dataStr = getBackupJsonString();
      const blob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      window.closeSaveAsModal();
      showToast(`Saved "${fileName}" to your computer.`);
    };

    // 4. Copy JSON to Clipboard
    window.copyBackupJsonToClipboard = async function() {
      const dataStr = getBackupJsonString();
      try {
        await navigator.clipboard.writeText(dataStr);
        showToast('Copied full estate plan data to clipboard!');
      } catch (e) {
        // Fallback for clipboard
        const ta = document.createElement('textarea');
        ta.value = dataStr;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast('Copied full estate plan data to clipboard!');
      }
    };

    window.updateDraftField = function(field, value) {

        if (value === 'Traditional IRA' || value === 'Roth IRA' || value === 'Workplace 401(k)/Pension') {
          draftForm.transferMechanism = 'Named IRA/Plan Beneficiary';
        } else if (value === 'Taxable Brokerage') {
          draftForm.transferMechanism = 'TOD (Transfer on Death)';
        } else if (value === 'Checking Account' || value === 'Savings / CD') {
          draftForm.transferMechanism = 'POD (Payable on Death / Totten Trust)';

          draftForm.transferMechanism = 'None (Probate Asset)';
        }
        render();
      } else if (field === 'perStirpes') {
        draftForm.perStirpes = Boolean(value);
        render();
      } else {

    window.equalSplitChildrenDraft = function() {
      const children = state.will.children.filter(c => c.fullName.trim());
      const names = children.length > 0 ? children.map(c => c.fullName) : ['Child 1', 'Child 2'];
      const share = Math.floor((100 / names.length) * 100) / 100;
      draftForm.beneficiaries = names.map((name, i) => ({
        id: 'b-' + Date.now() + '-' + i,
        name,
        percentage: i === names.length - 1 ? Number((100 - share * (names.length - 1)).toFixed(2)) : share
      }));
      render();
    };

    window.saveDraftAccount = function(e) {
      if (e) e.preventDefault();
      if (!draftForm.nickname.trim()) {
        draftForm.error = 'Please enter an Account Nickname / Institution.';
        render();
        return;
      }
      const totalPct = draftForm.beneficiaries.reduce((s, b) => s + (Number(b.percentage) || 0), 0);
      const allNamed = draftForm.beneficiaries.every(b => b.name.trim().length > 0);
      if (Math.abs(totalPct - 100) > 0.01 || !allNamed) {
        draftForm.error = 'Beneficiary splits must total exactly 100% and every beneficiary row must have a name.';
        render();
        return;
      }
      const record = {
        id: editingAccountId || ('acc-' + Date.now()),
        nickname: draftForm.nickname.trim(),
        accountType: draftForm.accountType,
        balance: Math.max(0, Number(draftForm.balance) || 0),
        ownershipTitle: draftForm.ownershipTitle,
        transferMechanism: draftForm.transferMechanism,
        perStirpes: draftForm.perStirpes,
        beneficiaries: draftForm.beneficiaries.map(b => ({ ...b }))
      };
      if (editingAccountId) {
        state.accounts = state.accounts.map(a => a.id === editingAccountId ? record : a);
        showToast('Updated account in portfolio.');
      } else {
        state.accounts.push(record);
        showToast('Added account to portfolio.');
      }
      window.cancelEditAccount();
      saveState();
      render();

    function renderAssetTrackerTab() {
      const totalEstate = state.accounts.reduce((s, a) => s + a.balance, 0);
      const unprotectedRealEstate = state.accounts.filter(
        a =>
          a.accountType === 'Real Property (NY Home/Condo/Co-op)' &&
          a.ownershipTitle === 'Sole Name' &&
          a.transferMechanism !== 'NY Transfer on Death Deed (RPL § 424)' &&
          a.transferMechanism !== 'Revocable Living Trust'
      );
      const hasProbateRealEstate = unprotectedRealEstate.length > 0;
      const soleProbateAccounts = state.accounts.filter(
        a => a.ownershipTitle === 'Sole Name' && a.transferMechanism === 'None (Probate Asset)'
      );
      const totalSoleProbate = soleProbateAccounts.reduce((s, a) => s + a.balance, 0);
      const SMALL_ESTATE_LIMIT = 50000;
      const qualifiesSmallEstate = totalSoleProbate <= SMALL_ESTATE_LIMIT && !hasProbateRealEstate;
      const gaugePct = hasProbateRealEstate ? 100 : Math.min(100, Math.round((totalSoleProbate / SMALL_ESTATE_LIMIT) * 100));

      const unprotectedAccounts = state.accounts.filter(
        a =>
          (a.accountType === 'Taxable Brokerage' && a.transferMechanism !== 'TOD (Transfer on Death)') ||
          ((a.accountType === 'Checking Account' || a.accountType === 'Savings / CD') &&
            a.transferMechanism !== 'POD (Payable on Death / Totten Trust)')
      );

          { title: 'Enter Each of Your Sole-Name Accounts', detail: 'Use the form on the left to list all of your IRAs, 401(k)s, taxable brokerage accounts, bank checking/savings accounts, NY real estate, and personal property.' },

          { title: 'Keep One Small Checking Buffer (<$50,000 Total Probate Personal Property)', detail: 'Leave one small checking account ($15k–$35k) as "None (Probate Asset)" to pay funeral and final tax bills, while keeping the NY $50,000 Small Estate Gauge in the green.' }

                <span class="text-sm font-mono font-bold text-slate-900">

                  <p class="text-xs text-emerald-800 mt-0.5">

                  <div>

                    </select>
                  </div>
                  <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Approximate Balance ($)</label>
                    <input

                    <label class="block text-xs font-semibold text-slate-700 mb-1">Ownership Title</label>
                    <select

                  <div>

                    <div class="inline-flex rounded-lg border border-slate-300 bg-white p-0.5">
                      <button

    function renderElectiveShareTab() {
      const autoProbate = state.accounts
        .filter(a => a.transferMechanism === 'None (Probate Asset)')
        .reduce((s, a) => s + a.balance, 0);
      const autoSubs = state.accounts
        .filter(a => a.transferMechanism !== 'None (Probate Asset)')
        .reduce((s, a) => s + a.balance, 0);

      const probateAssets = state.electiveShare.useManualOverride
        ? state.electiveShare.manualProbateAssets
        : autoProbate;
      const testamentarySubs = state.electiveShare.useManualOverride
        ? state.electiveShare.manualTestamentarySubstitutes
        : autoSubs;

      const grossEstate = probateAssets + testamentarySubs;
      const expenses = Math.max(0, state.electiveShare.estimatedExpenses || 0);
      const amountPassingToSpouse = Math.max(0, state.electiveShare.amountPassingToSpouse || 0);
      const netElectiveEstate = Math.max(0, grossEstate - expenses);
      const grossElectiveShare =
        netElectiveEstate === 0
          ? 0
          : Math.min(netElectiveEstate, Math.max(50000, netElectiveEstate / 3));
      const statutoryElectiveShare = Math.max(0, grossElectiveShare - amountPassingToSpouse);
      const childrenNetScenarioA = Math.max(0, netElectiveEstate - amountPassingToSpouse - statutoryElectiveShare);

      const helpBanner = renderSectionHelpBanner(
        'elective-share',
        "Section 2 Guide: Understanding New York's 1/3 Spousal Right of Election",
        "Many married New Yorkers assume that if they keep all accounts in their sole name and name their children as TOD/POD/IRA beneficiaries, 100% will go to their children. In New York, that is FALSE unless your spouse signs a formal written waiver. Under NY EPTL § 5-1.1-A, your spouse (or their Power of Attorney, guardian, or Medicaid if they ever need nursing home care) can claim 1/3 of your combined estate—clawing it back directly from your children's inherited IRAs and TOD/POD accounts.",

          { title: 'Verify Your Auto-Pulled Estate Totals', detail: 'Your Probate Assets and Testamentary Substitutes (IRAs, TOD, POD) are automatically pulled from Tab 1. You can check "Manual Override" to test different what-if numbers.' },
          { title: 'Enter Final Expenses & Any Voluntary Provision for Spouse', detail: 'Enter approximate final expenses (e.g., $15,000–$25,000) and any amount passing outright to your spouse (default $0) to model partial or negotiated settlements.' },
          { title: 'Compare Scenario A vs. Scenario B Below', detail: 'Review Scenario A to see the exact dollar amount clawed back from each account without a waiver, and Scenario B to see how a Deed-Acknowledged Mutual Waiver (EPTL § 5-1.1-A(e) & § 5-3.1) reduces the spousal claim to $0.' }
        ],
        [
          { term: 'Right of Election (EPTL § 5-1.1-A)', definition: 'A surviving spouse’s statutory right in New York to take the greater of $50,000 or 1/3 (33.33%) of your Net Elective Estate, reduced by anything passing outright to the spouse.' },
          { term: 'Testamentary Substitutes', definition: 'Non-probate assets (IRAs, 401(k)s, TOD brokerage, POD bank accounts, cash-value life insurance) counted when calculating the 1/3 spousal share. (Term/employer life insurance is nuanced under NY case law—verify with counsel.)' },
          { term: 'Pro-Rata Clawback', definition: 'If an election is filed, beneficiaries of your IRAs, TODs, PODs, and Will contribute their proportional share to pay the spouse’s unpaid net elective share.' },
          { term: 'Deed-Acknowledged Waiver (EPTL § 5-1.1-A(e))', definition: 'A signed written agreement formally acknowledged before a Notary Public in NY real-estate deed form waiving spousal inheritance & exempt property rights.' }
        ]
      );

                    <span class="font-mono font-semibold text-rose-700">- ${formatCurrency(expenses)}</span>
                  </div>
                  <div class="flex justify-between py-2.5 px-3 rounded-lg bg-slate-100 font-bold text-slate-900">
                    <span>Net Elective Estate = (Probate + Substitutes) - Expenses</span>
                    <span class="font-mono text-base">${formatCurrency(netElectiveEstate)}</span>
                  </div>
                  ${amountPassingToSpouse > 0 ? `
                    <div class="flex justify-between py-1.5 px-3 border-b border-slate-100 text-xs">

                  <div class="flex justify-between items-center py-2.5 px-3 rounded-lg bg-amber-50 border border-amber-200 text-amber-950">

                      <div class="font-bold">Net Unpaid Elective Share Claim (Greater of $50k or 1/3, less Spouse Credit)</div>

                    <div class="text-xl sm:text-2xl font-bold font-mono text-red-700 mt-1">${formatCurrency(statutoryElectiveShare)}</div>
                    <div class="text-[11px] text-red-700 mt-0.5">Clawed back pro-rata</div>
                  </div>
                  <div class="p-3.5 rounded-xl bg-slate-50 border border-slate-200">
                    <div class="text-xs font-semibold text-slate-700">Net Left to Children</div>
                    <div class="text-xl sm:text-2xl font-bold font-mono text-slate-900 mt-1">${formatCurrency(childrenNetScenarioA)}</div>
                    <div class="text-[11px] text-slate-500 mt-0.5">Reduced by elective claim</div>

                <div class="border border-slate-200 rounded-lg overflow-hidden">
                  <table class="w-full text-xs text-left">

                      <tr>
                        <th class="py-2 px-3">Children's Inherited Account</th>
                        <th class="py-2 px-3 text-right">Balance</th>
                        <th class="py-2 px-3 text-right text-red-700">Pro-Rata Clawback</th>
                      </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-200">
                      ${state.accounts.map(acc => {
                        const ratio = grossEstate > 0 ? acc.balance / grossEstate : 0;
                        const clawback = statutoryElectiveShare * ratio;
                        return `
                          <tr>
                            <td class="py-1.5 px-3 font-medium text-slate-800">${escapeHtml(acc.nickname)}</td>
                            <td class="py-1.5 px-3 text-right font-mono text-slate-600">${formatCurrency(acc.balance)}</td>
                            <td class="py-1.5 px-3 text-right font-mono font-semibold text-red-700">-${formatCurrency(clawback)}</td>
                          </tr>

                      }).join('')}
                    </tbody>
                  </table>
                </div>

                <div class="p-3 rounded-lg bg-red-50 border border-red-200 text-xs text-red-950">
                  <strong>Separate Trap — Family Exempt Property (<code class="font-mono">EPTL § 5-3.1</code>):</strong> Completely <em>independent</em> of the 1/3 Right of Election, NY law awards a surviving spouse up to <strong>$25,000 in cash/equivalents</strong>, <strong>1 motor vehicle up to $25,000</strong>, and <strong>$20,000 in household furniture/appliances</strong> off the top of your estate—unless <strong>explicitly waived</strong> by statute in your Mutual Waiver.

                      ? '<strong>Strategy:</strong> ' + escapeHtml(prep.realEstatePlanOption || 'NY Transfer on Death Deed (RPL § 424)') + (prep.realEstateNotes ? ' — ' + escapeHtml(prep.realEstateNotes) : '') + '. <em>(Note: An RPL § 424 TOD Deed is revocable, requires 2 witnesses + notary, is void if not recorded before death, and creditors can reach TOD-deed property if the probate estate is insufficient.)</em>'
                      : 'No sole-name NY real estate reported at this time. (Note: SCPA § 1301 Small Estate limit excludes real property.)'}
                  </p>
                </div>
              </div>
              <div class="p-3 rounded-lg border border-amber-300 bg-amber-50/50 text-xs text-amber-950">
                <strong>Revocable Living Trust vs. DIY Backup Will (<code class="font-mono">SCPA § 1403</code> / <code class="font-mono">§ 1404</code>):</strong> Evaluate establishing a <strong>fully funded Revocable Living Trust</strong> (or attorney-supervised Will execution) so children avoid formal Surrogate&apos;s Court probate, mandatory spousal citation (<code class="font-mono">SCPA § 1403</code>), and potential <code class="font-mono">SCPA § 1404</code> witness examinations.
              </div>
            </div>

            <!-- Section D: Digital Assets & Family Letter of Instruction -->
            <div class="space-y-2.5 pt-3 border-t border-slate-300 print-avoid-break">
              <h3 class="text-sm font-bold uppercase tracking-wide text-slate-900">
                Section D: Digital Assets (<code class="font-mono">EPTL Art. 13-A</code>) &amp; Family Letter of Instruction
              </h3>
              <div class="p-3.5 rounded-lg border border-slate-300 bg-slate-50 text-xs space-y-1.5">
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 pb-1.5 border-b border-slate-200">
                  <div><strong>RUFADAA Clause:</strong> ${(prep.includeDigitalAssetsClause ?? true) ? 'Yes' : 'No'}</div>
                  <div><strong>Apple Legacy:</strong> ${prep.appleLegacyContactSet ? 'Set' : 'Pending'}</div>
                  <div><strong>Google Inactive:</strong> ${prep.googleInactiveManagerSet ? 'Set' : 'Pending'}</div>
                  <div><strong>Custodian PDFs:</strong> ${prep.beneficiaryAuditVerified ? 'Verified' : 'Pending'}</div>
                </div>
                <div class="text-slate-700 space-y-1">
                  <div><strong>Original Wet-Ink Documents Location:</strong> ${escapeHtml(prep.originalDocumentsLocation || '[Specify safe home location — avoid bank safe deposit boxes]')}</div>
                  <div><strong>Password Manager / Device Key Location:</strong> ${escapeHtml(prep.passwordManagerLocation || '[Specify offline location of recovery key — never store passwords here]')}</div>
                  ${prep.keyContactsNotes ? `<div><strong>Key Advisors (CPA / Financial / Insurance):</strong> ${escapeHtml(prep.keyContactsNotes)}</div>` : ''}
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderHelpGuideTab() {
      const categories = ['All', 'Accounts & Probate', 'Spousal Rights', 'Will & Signing', 'Powers & Medical'];
      const q = glossarySearch.toLowerCase().trim();
      const filtered = GLOSSARY_ENTRIES.filter(entry => {
        const matchCat = glossaryCategory === 'All' || entry.category === glossaryCategory;
        const matchSearch = !q ||
          entry.term.toLowerCase().includes(q) ||
          (entry.statute && entry.statute.toLowerCase().includes(q)) ||
          entry.plainMeaning.toLowerCase().includes(q) ||
          entry.whyItMatters.toLowerCase().includes(q);
        return matchCat && matchSearch;
      });

      const masterSteps = [
        {
          num: 'Step 1',
          tab: 'assets',
          title: 'Inventory Every Sole-Name Account & Add TOD/POD Beneficiaries (Tab 1)',
          bullets: [
            'Enter each of your IRAs, 401(k)s, brokerage accounts, bank accounts, and personal property in Tab 1.',
            'Contact your brokerage firm(s) to add a TOD (Transfer on Death) form and your bank(s) to add a POD (Payable on Death / Totten Trust) form naming your children totaling 100%.',
            'Make sure the "Per Stirpes" box is checked on every beneficiary form so a predeceased child’s share passes to their children (your grandchildren).',
            'Leave one small sole-name checking account ($15,000–$35,000, strictly under $50,000 total probate assets) WITHOUT a POD so your Executor has cash to pay funeral and final tax bills via a $1 NY Small Estate Affidavit (SCPA § 1301).'
          ],
          btnLabel: 'Go to Tab 1: Asset Tracker →'
        },
        {
          num: 'Step 2',
          tab: 'elective-share',
          title: 'Check Your Spousal Right of Election Exposure (Tab 2)',
          bullets: [
            'Review Tab 2 to see how New York EPTL § 5-1.1-A counts your IRAs, TOD brokerage accounts, and POD bank accounts as "Testamentary Substitutes."',
            'Compare Scenario A (Without Written Waiver — where 1/3 of your children’s inherited accounts can be clawed back by a spouse, their POA/guardian, or Medicaid) vs. Scenario B (With a Deed-Acknowledged Mutual Waiver — $0 spousal claim, 100% to your children).'
          ],
          btnLabel: 'Go to Tab 2: Elective Share Simulator →'
        },
        {
          num: 'Step 3',
          tab: 'will-generator',
          title: 'Generate & Properly Execute Your NY Backup Will (Tab 3)',
          bullets: [
            'Enter your full legal name, NY county, spouse’s full name (for the intentional-omission clause), children’s full names, and Primary/Successor Executors.',
            'Print the generated Will and SCPA § 1406 Self-Proving Affidavit on standard US Letter paper.',
            'Follow all 5 Execution Guardrails: sign at the physical end in front of two disinterested adult witnesses (not your children or spouse) and a NY Notary Public, have witnesses write their residential addresses, and never unstaple the signed original.'
          ],
          btnLabel: 'Go to Tab 3: Backup Will Generator →'
        },
        {
          num: 'Step 4',
          tab: 'attorney-prep',
          title: 'Print Your 1-Page NY Attorney Briefing Packet for the Mutual Waiver (Tab 4)',
          bullets: [
            'Add an approximate list of your spouse’s separate accounts in Tab 4 so both Schedules A & B financial disclosures are ready.',
            'Choose your Primary and Backup Agents for your NY Statutory Short Form Power of Attorney (GOL § 5-1513) and NY Health Care Proxy.',
            'Click "Print Attorney Briefing Packet" and bring the 1-page sheet to a local New York estate planning attorney to draft and notarize the EPTL § 5-1.1-A(e) Mutual Waiver in real-estate deed form.'
          ],
          btnLabel: 'Go to Tab 4: Attorney Prep Packet →'
        }
      ];

      return `
        <div class="space-y-6">
          <div class="bg-[#0F172A] text-white rounded-xl border border-slate-800 p-5 sm:p-6">
            <span class="inline-block px-2.5 py-0.5 rounded bg-emerald-500/20 border border-emerald-400/30 text-emerald-300 text-xs font-mono font-semibold">
              Plain-English User Guide &amp; New York Legal Glossary
            </span>
            <h2 class="text-lg sm:text-xl font-bold mt-1.5">
              How This Planner Works &amp; Exact Steps to Protect 100% of Your Estate for Your Children
            </h2>
            <p class="text-xs sm:text-sm text-slate-300 mt-1 leading-relaxed max-w-4xl">
              New York estate law has unique rules for blended families. Even if every dollar you own is in your <strong>sole name</strong> and you name your children as 100% beneficiaries on every account, two New York traps can still intercept your children's inheritance: (1) <strong>Surrogate's Court Probate</strong> if sole-name accounts without beneficiaries exceed $50,000, and (2) <strong>New York's 1/3 Spousal Right of Election (<code class="text-amber-300">EPTL § 5-1.1-A</code>)</strong>. Follow the 4-Step Master Plan below to solve both.
            </p>
          </div>

          <div class="bg-white rounded-xl border border-slate-200 shadow-xs p-5 space-y-4">
            <div class="border-b border-slate-200 pb-3">
              <h3 class="text-base font-bold text-slate-900">Step-by-Step Roadmap: What to Do in Each Section</h3>
              <p class="text-xs text-slate-500 mt-0.5">Complete these four sections in order. All progress saves automatically in your browser.</p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              ${masterSteps.map(st => `
                <div class="rounded-xl border border-slate-200 bg-slate-50/70 p-4 flex flex-col justify-between space-y-4">
                  <div class="space-y-2.5">
                    <div>
                      <span class="text-[11px] font-mono font-bold uppercase tracking-wider text-emerald-700">${st.num}</span>
                      <h4 class="text-sm font-bold text-slate-900 leading-snug">${escapeHtml(st.title)}</h4>
                    </div>
                    <ul class="space-y-1.5 text-xs text-slate-700">
                      ${st.bullets.map(b => `<li class="flex items-start gap-2"><span class="text-emerald-600 font-bold">✓</span><span class="leading-relaxed">${escapeHtml(b)}</span></li>`).join('')}
                    </ul>
                  </div>
                  <button
                    type="button"
                    onclick="switchTab('${st.tab}')"
                    class="w-full py-2 px-3 rounded-lg bg-[#0F172A] hover:bg-slate-800 text-white text-xs font-semibold cursor-pointer"
                  >
                    ${escapeHtml(st.btnLabel)}
                  </button>
                </div>
              `).join('')}
            </div>
          </div>

          <!-- Searchable Plain-English Glossary -->
          <div class="bg-white rounded-xl border border-slate-200 shadow-xs p-5 space-y-4">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-200 pb-4">
              <div>
                <h3 class="text-base font-bold text-slate-900">Plain-English Glossary: What Every Term &amp; NY Statute Means</h3>
                <p class="text-xs text-slate-500">Search or filter by category to understand every legal term and alert in the app.</p>
              </div>
              <div class="w-full sm:w-72">
                <input
                  id="glossary-search-input"
                  type="text"
                  value="${escapeHtml(glossarySearch)}"
                  oninput="updateGlossarySearch(this.value)"
                  placeholder="Search term (e.g., TOD, Per Stirpes, 5-1.1-A)..."
                  class="w-full px-3 py-1.5 rounded-lg border border-slate-300 text-xs text-slate-900"
                />
              </div>
            </div>

            <div class="flex flex-wrap gap-2">
              ${categories.map(cat => `
                <button
                  type="button"
                  onclick="setGlossaryCategory('${cat}')"
                  class="px-3 py-1 rounded-full text-xs font-semibold cursor-pointer ${glossaryCategory === cat ? 'bg-[#0F172A] text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}"
                >
                  ${escapeHtml(cat)}
                </button>
              `).join('')}
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              ${filtered.map(item => `
                <div class="p-4 rounded-xl border border-slate-200 bg-slate-50/40 space-y-2">
                  <div class="flex flex-wrap items-center justify-between gap-2">
                    <h4 class="text-sm font-bold text-slate-900">${escapeHtml(item.term)}</h4>
                    ${item.statute ? `<span class="px-2 py-0.5 rounded text-[11px] font-mono font-semibold bg-slate-200 text-slate-800">${escapeHtml(item.statute)}</span>` : ''}
                  </div>
                  <p class="text-xs text-slate-700 leading-relaxed">
                    <strong class="text-slate-900">What it means: </strong>${escapeHtml(item.plainMeaning)}
                  </p>
                  <div class="p-2.5 rounded-lg bg-emerald-50/80 border border-emerald-200 text-xs text-emerald-950">
                    <strong class="text-emerald-900">Why it matters to you: </strong>${escapeHtml(item.whyItMatters)}
                  </div>
                </div>
              `).join('')}
            </div>
          </div>

          <!-- Top 3 Mistakes -->
          <div class="bg-amber-50 border border-amber-300 rounded-xl p-5 space-y-3">
            <h3 class="text-sm font-bold text-amber-950">⚠ Top 3 Mistakes Married New Yorkers Make in Blended Families</h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs">
              <div class="p-3 rounded-lg bg-white border border-amber-200">
                <div class="font-bold text-slate-900 mb-1">Mistake #1: Relying on a Verbal Promise</div>
                <p class="text-slate-700 leading-relaxed">Even if your spouse never intends to touch your children's money, if your spouse later enters a nursing home on Medicaid, the county can force an EPTL § 5-1.1-A claim unless a notarized deed-form waiver was signed.</p>
              </div>
              <div class="p-3 rounded-lg bg-white border border-amber-200">
                <div class="font-bold text-slate-900 mb-1">Mistake #2: Having a Child Witness Your Will</div>
                <p class="text-slate-700 leading-relaxed">Under EPTL § 3-3.2, if a child who inherits under your Will serves as one of the two witnesses, their inheritance under the Will is legally voided. Always use two unrelated adult witnesses.</p>
              </div>
              <div class="p-3 rounded-lg bg-white border border-amber-200">
                <div class="font-bold text-slate-900 mb-1">Mistake #3: Leaving Over $50,000 Without TOD/POD</div>
                <p class="text-slate-700 leading-relaxed">If sole-name accounts without a TOD/POD beneficiary exceed $50,000, your children cannot use the $1 Small Estate Affidavit (SCPA § 1301) and must serve formal Surrogate's Court citations on your surviving spouse.</p>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function render() {
      // Preserve active input focus & cursor position so typing never loses focus
      const prevEl = document.activeElement;
      const prevId = prevEl && prevEl.id ? prevEl.id : null;
      const prevSelStart = prevEl && typeof prevEl.selectionStart === 'number' ? prevEl.selectionStart : null;
      const prevSelEnd = prevEl && typeof prevEl.selectionEnd === 'number' ? prevEl.selectionEnd : null;

      const unprotectedCount = state.accounts.filter(
        a =>
          (a.accountType === 'Taxable Brokerage' && a.transferMechanism !== 'TOD (Transfer on Death)') ||
          ((a.accountType === 'Checking Account' || a.accountType === 'Savings / CD') &&
            a.transferMechanism !== 'POD (Payable on Death / Totten Trust)')
      ).length;

      const hasProbateRealEstate = state.accounts.some(
        a =>
          a.accountType === 'Real Property (NY Home/Condo/Co-op)' &&
          a.ownershipTitle === 'Sole Name' &&
          a.transferMechanism !== 'NY Transfer on Death Deed (RPL § 424)' &&
          a.transferMechanism !== 'Revocable Living Trust'
      );

      const totalSoleProbate = state.accounts
        .filter(a => a.ownershipTitle === 'Sole Name' && a.transferMechanism === 'None (Probate Asset)')
        .reduce((s, a) => s + a.balance, 0);

      const probateExceedsLimit = totalSoleProbate > 50000 || hasProbateRealEstate;

      let tabContent = '';
      if (activeTab === 'assets') tabContent = renderAssetTrackerTab();
      else if (activeTab === 'elective-share') tabContent = renderElectiveShareTab();
      else if (activeTab === 'will-generator') tabContent = renderBackupWillTab();
      else if (activeTab === 'attorney-prep') tabContent = renderAttorneyPrepTab();
      else if (activeTab === 'help-guide') tabContent = renderHelpGuideTab();

      const appEl = document.getElementById('app');
      appEl.innerHTML = `
        ${renderHeader(unprotectedCount, probateExceedsLimit)}
        ${renderPlanManagerModal()}
        ${renderNewPlanModal()}
        ${renderSaveAsModal()}
        ${toastMessage ? `
          <div class="fixed bottom-14 right-4 z-50 px-4 py-2.5 rounded-lg bg-[#0F172A] text-white text-xs font-semibold shadow-lg border border-emerald-500/40 no-print">
            ✓ ${escapeHtml(toastMessage)}
          </div>
        ` : ''}
        <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
          ${tabContent}
        </main>
        <footer class="bg-[#0F172A] text-slate-300 border-t border-slate-800 py-3 px-4 no-print mt-auto">
          <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2 text-xs">
            <div>
              <em>Educational &amp; organizational tool only. Not legal advice. Consult a New York estate planning attorney before executing legal instruments.</em>
            </div>
            <div class="text-[11px] text-slate-400 font-mono shrink-0 flex flex-wrap items-center gap-2">
              <span class="px-2 py-0.5 rounded bg-slate-800 text-emerald-300 border border-slate-700">NY Law Verified: Nov 2026</span>
              <span>EPTL § 5-1.1-A • § 5-3.1 • § 3-2.1 • SCPA § 1301 • GOL § 5-1513 • RPL § 424</span>
            </div>
          </div>
        </footer>
      `;

      // Restore focus & selection if an input with an ID was active
      if (prevId) {
        const nextEl = document.getElementById(prevId);
        if (nextEl) {
          nextEl.focus();
          if (prevSelStart !== null && typeof nextEl.setSelectionRange === 'function') {
            try {
              nextEl.setSelectionRange(prevSelStart, prevSelEnd);
            } catch (e) {}
          }
        }
      }
    }

    render();
  </script>
</body>
</html>
